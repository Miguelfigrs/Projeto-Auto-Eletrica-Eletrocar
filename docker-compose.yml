# ==============================================================================
# Docker Compose Integrado: PostgreSQL 16 + FastAPI Backend + pgAdmin 4
# Projeto: Auto Elétrica Eletrocar
#
#   docker compose up -d --build          -> sobe tudo (migrações Alembic rodam na API)
#   docker exec eletrocar_api pytest      -> testes (PostgreSQL real, cobertura mínima de 80%)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Banco de Dados: PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: eletrocar_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eletrocar2026}
      POSTGRES_DB: ${POSTGRES_DB:-eletrocar_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Somente extensões + banco de testes; o esquema é criado pelas migrações Alembic da API
      - ./Eletrocar.Database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      eletrocar_network:
        aliases:
          - eletrocar_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-eletrocar_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # 2. Backend API: FastAPI (Python 3.12 - Clean Architecture)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./Eletrocar.API
      dockerfile: Dockerfile
    container_name: eletrocar_api
    restart: always
    environment:
      AMBIENTE: ${AMBIENTE:-desenvolvimento}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-eletrocar2026}@postgres:5432/${POSTGRES_DB:-eletrocar_db}
      # Banco exclusivo dos testes de integração (criado pelo init.sql)
      TEST_POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-eletrocar2026}@postgres:5432/eletrocar_test
      MIGRAR_NA_INICIALIZACAO: "true"
      # Carga de demonstração (somente desenvolvimento): aplicada se o banco não tiver usuários
      SEED_DADOS_DEMO: ${SEED_DADOS_DEMO:-true}
      SEED_SQL_PATH: /database/seed_completo.sql
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA_INICIAL: ${ADMIN_SENHA_INICIAL:-}
      SECRET_KEY: ${SECRET_KEY:-eletrocar_dev_secret_troque_em_producao}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      URL_PAINEL: ${URL_PAINEL:-http://localhost:5173}
      LIMITE_DESCONTO_SEM_AUTORIZACAO_PERCENTUAL: ${LIMITE_DESCONTO_SEM_AUTORIZACAO_PERCENTUAL:-5}
      # Telegram Voice Bot -> Whisper ASR -> LLM (Claude)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-eletrocar_webhook_dev}
      WHISPER_API_URL: ${WHISPER_API_URL:-https://api.openai.com/v1/audio/transcriptions}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODELO: ${LLM_MODELO:-claude-opus-5-5}
      # PIX
      # Chave fictícia apenas para demonstração local; em produção defina a chave real no .env
      PIX_CHAVE: ${PIX_CHAVE:-pix-demonstracao@eletrocar.com.br}
      PIX_WEBHOOK_SECRET: ${PIX_WEBHOOK_SECRET:-eletrocar_webhook_dev}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./Eletrocar.API/src:/app/src
      - ./Eletrocar.API/tests:/app/tests
      - ./Eletrocar.Database/seed_completo.sql:/database/seed_completo.sql:ro
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--proxy-headers"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eletrocar_network

  # ----------------------------------------------------------------------------
  # 3. Gerenciador Web do Banco: pgAdmin 4
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eletrocar_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@eletrocar.com.br}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./Eletrocar.Database/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eletrocar_network

networks:
  eletrocar_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
