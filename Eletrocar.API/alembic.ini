# Migrações do banco de dados (Alembic) - Auto Elétrica Eletrocar
# A URL do banco vem de DATABASE_URL (ver src/infra/database/migracoes/env.py).
# Uso dentro do contêiner:  docker exec eletrocar_api alembic upgrade head

[alembic]
script_location = src/infra/database/migracoes
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
