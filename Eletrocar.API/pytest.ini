[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# Cobertura mínima obrigatória de 80% (a suíte falha abaixo disso)
addopts = --cov=src --cov-report=term-missing:skip-covered --cov-fail-under=80
markers =
    postgres: testes que exigem PostgreSQL 16 real (defina TEST_POSTGRES_URL; rodam no contêiner da API)
